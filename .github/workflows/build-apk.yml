# Build the EdgeTX-on-Android APK on a clean GitHub runner.
#
# Runs on Windows because app/build.gradle.kts's buildEdgeTxSimulator task is
# written for it: it shells out through cmd.exe, uses the checkout's
# .venv/Scripts/python.exe and the windows-x86_64 NDK toolchain.
#
# The APK is a thin host around the real EdgeTX firmware, cross-compiled into
# libedgetx-st16mk3-simulator.so from the public fork cpp2go/edgetx_esp32. Modes:
#
#   source    (default) - clone the fork, apply patches/ (a small compatibility
#                         shim, see patches/README.md), build the library and the
#                         APK.  No local toolchain needed.
#   prebuilt            - reuse an already-built .so (URL / old APK / repo
#                         path edgetx-lib/ or .edgetx/) and package it with
#                         -Pedgetx.skipBuild=true.
#
# Run from the Actions tab (workflow_dispatch) or `gh workflow run`.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      edgetx_mode:
        description: "How to obtain the simulator library"
        type: choice
        options: [source, prebuilt]
        default: source
      edgetx_repo:
        description: "(source) EdgeTX fork to build"
        type: string
        default: "https://github.com/cpp2go/edgetx_esp32"
      edgetx_ref:
        description: "(source) Branch, tag or commit (pinned to the fork main of 2026-09-15)"
        type: string
        default: "793e11364f30ca39acfbc153a83da093f8e32c81"
      sim_lib_url:
        description: "(prebuilt) URL to an arm64-v8a libedgetx-st16mk3-simulator.so, or to an APK to extract it from"
        type: string
        default: ""
      dji_msdk:
        description: "Package the DJI Mobile SDK (needed for the RC Plus 2 5-way switch)"
        type: boolean
        default: false
      dji_app_key:
        description: "(dji_msdk) App Key from developer.dji.com, bound to com.edgetx.droidui + the signing certificate"
        type: string
        default: ""
      new_signing_key:
        description: "Create signing/release.keystore if it is missing (then commit it - the DJI App Key is bound to that certificate)"
        type: boolean
        default: false

  # Triggerable without the Actions web UI, which needs nothing beyond a token
  # with Contents: write:
  #   POST /repos/{owner}/{repo}/dispatches
  #   {"event_type":"build-apk","client_payload":{"edgetx_mode":"prebuilt"}}
  # A dispatched run passes no inputs, so the mode checks below read
  # "not source" as prebuilt.  tools/dispatch-build.ps1 does the call.
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"
      BUILD_TOOLS: "36.1.0"
      PLATFORM: "android-36"
      ANDROID_SDK_ROOT: "${{ github.workspace }}/android-sdk"
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"

      # A run started from the Actions tab passes workflow inputs; one started through
      # the API (repository_dispatch, see tools/dispatch-build.ps1) passes no inputs at
      # all but a client_payload. Both are read here, so the same build can be started
      # either way:
      #   POST /repos/{owner}/{repo}/dispatches
      #   {"event_type":"build-apk","client_payload":{
      #      "edgetx_mode":"prebuilt","dji_msdk":"true","dji_app_key":"..."}}
      EDGETX_MODE: ${{ github.event.client_payload.edgetx_mode || inputs.edgetx_mode || 'prebuilt' }}
      EDGETX_REPO: ${{ github.event.client_payload.edgetx_repo || inputs.edgetx_repo || 'https://github.com/cpp2go/edgetx_esp32' }}
      EDGETX_REF: ${{ github.event.client_payload.edgetx_ref || inputs.edgetx_ref || '793e11364f30ca39acfbc153a83da093f8e32c81' }}
      SIM_LIB_URL: ${{ github.event.client_payload.sim_lib_url || inputs.sim_lib_url || '' }}
      DJI_MSDK: ${{ github.event.client_payload.dji_msdk || inputs.dji_msdk || 'false' }}
      DJI_APP_KEY: ${{ github.event.client_payload.dji_app_key || inputs.dji_app_key || '' }}
      NEW_SIGNING_KEY: ${{ github.event.client_payload.new_signing_key || inputs.new_signing_key || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.11
        if: ${{ env.EDGETX_MODE == 'source' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android command-line tools
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          New-Item -ItemType Directory -Force -Path "$sdk\cmdline-tools" | Out-Null
          $zip = "$env:RUNNER_TEMP\clt.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\clt" -Force
          Move-Item "$env:RUNNER_TEMP\clt\cmdline-tools" "$sdk\cmdline-tools\latest"
          echo "$sdk\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_SDK_ROOT
          $sm      = "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat"
          Write-Host "sdk root   : $sdkRoot"
          Write-Host "sdkmanager : $sm"
          Write-Host "exists     : $(Test-Path $sm)"
          Write-Host "java home  : $env:JAVA_HOME"

          # Accept the SDK licences up front by writing the hash files
          # sdkmanager reads. Piping "y" into `sdkmanager --licenses` is not
          # reliable from PowerShell, and a rejected licence aborts the install
          # before a single byte is downloaded.
          New-Item -ItemType Directory -Force -Path "$sdkRoot\licenses" | Out-Null
          $hashes = @(
            "24333f8a63b6825ea9c5514f83c2829b004d1fee",
            "8933bad161af4178b1185d1a37fbf41ea5269c55",
            "d56f5187479451eabf01fb78af6dfcb131a6481e",
            "84831b9409646a918e30573bab4c9c91346d8abd"
          )
          $licenseFiles = @(
            "android-sdk-license", "android-sdk-preview-license",
            "android-googletv-license", "android-sdk-arm-dbt-license"
          )
          foreach ($name in $licenseFiles) {
            $hashes | Out-File "$sdkRoot\licenses\$name" -Encoding ascii
            Write-Host "licence accepted: $name"
          }

          # build-tools revisions are three-part ("36.1.0", never "36.1"). AGP
          # picks its own revision when the module does not pin one, so install
          # both current 36.x revisions.
          $pkgs = @(
            "platform-tools"
            "platforms;$env:PLATFORM"
            "build-tools;$env:BUILD_TOOLS"
            "build-tools;36.0.0"
            "ndk;$env:NDK_VERSION"
            "cmake;$env:CMAKE_VERSION"
          )
          Write-Host "installing : $($pkgs -join ' ')"
          $out  = & $sm "--sdk_root=$sdkRoot" @pkgs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "sdkmanager: $_" }
          if ($code -ne 0) {
            # Put the reason in a check annotation: that stays readable through
            # the REST API even when the web UI is unreachable.
            $tail = (($out | Select-Object -Last 25) -join "%0A")
            Write-Host "::error title=sdkmanager failed::$tail"
            throw "sdkmanager exited with $code"
          }
          Get-ChildItem "$sdkRoot\build-tools" -Directory | ForEach-Object { Write-Host "build-tools: $($_.Name)" }

      - name: Write local.properties
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT -replace '\\','/'
          "sdk.dir=$sdk" | Out-File -FilePath local.properties -Encoding ascii

      # ------------------------------------------------------------------
      # The simulated SD card (app/src/main/assets/sdcard) is ~920 small stock
      # EdgeTX 2.12 files; it is deliberately not tracked in this repository.
      # It is taken from the upstream app this tree derives from, pinned to the
      # commit whose copy matches it. Skipped if the files are already there.
      # ------------------------------------------------------------------
      - name: Fetch the simulated SD card
        shell: pwsh
        run: |
          $stamp = "app\src\main\assets\sdcard\edgetx.sdcard.version"
          if (Test-Path $stamp) {
            Write-Host "simulated SD card already present: $(Get-Content $stamp)"
            exit 0
          }
          $ref = "8de786bf50d2fe451a9d87c28b71980ff7a50b23"
          $tgz = "$env:RUNNER_TEMP\app-src.tar.gz"
          Invoke-WebRequest -Uri "https://codeload.github.com/cpp2go/edgetx_apk/tar.gz/$ref" -OutFile $tgz
          $ex  = "$env:RUNNER_TEMP\app-src"
          New-Item -ItemType Directory -Force -Path $ex | Out-Null
          tar -xzf $tgz -C $ex
          $top = Get-ChildItem $ex -Directory | Select-Object -First 1
          $from = Join-Path $top.FullName "app\src\main\assets\sdcard"
          if (-not (Test-Path $from)) { Write-Error "no $from in the upstream tarball" }
          New-Item -ItemType Directory -Force -Path "app\src\main\assets" | Out-Null
          Copy-Item $from "app\src\main\assets\sdcard" -Recurse -Force
          $n = (Get-ChildItem "app\src\main\assets\sdcard" -Recurse -File).Count
          Write-Host "simulated SD card: $n file(s), version $(Get-Content $stamp)"
          if ($n -lt 900) { Write-Error "only $n files copied - upstream layout changed?" }

      # ------------------------------------------------------------------
      # source mode: the public EdgeTX fork + the compatibility shim
      # ------------------------------------------------------------------
      - name: Check out the EdgeTX fork
        if: ${{ env.EDGETX_MODE == 'source' }}
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --recursive "${{ env.EDGETX_REPO }}" edgetx
          git -C edgetx checkout "${{ env.EDGETX_REF }}"
          git -C edgetx submodule update --init --recursive

      - name: Create the EdgeTX Python virtualenv
        if: ${{ env.EDGETX_MODE == 'source' }}
        shell: pwsh
        run: |
          python -m venv edgetx\.venv
          edgetx\.venv\Scripts\python.exe -m pip install --upgrade pip
          edgetx\.venv\Scripts\python.exe -m pip install pydantic clang

      - name: Apply the Android host patch
        if: ${{ env.EDGETX_MODE == 'source' }}
        shell: pwsh
        run: python patches\apply.py edgetx

      # ------------------------------------------------------------------
      # prebuilt mode: fetch/extract libedgetx-st16mk3-simulator.so
      # ------------------------------------------------------------------
      - name: Stage prebuilt simulator library (from URL)
        if: ${{ env.EDGETX_MODE != 'source' && env.SIM_LIB_URL != '' }}
        shell: pwsh
        run: |
          $out = "app\build\edgetx-libs\arm64-v8a"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dst = "$out\libedgetx-st16mk3-simulator.so"
          $dl  = "$env:RUNNER_TEMP\simlib.bin"
          Invoke-WebRequest -Uri "${{ env.SIM_LIB_URL }}" -OutFile $dl
          $magic = [System.IO.File]::ReadAllBytes($dl)[0..1]
          if ($magic[0] -eq 0x50 -and $magic[1] -eq 0x4B) {
            # PK -> it is an APK (zip); pull the library out of it.
            Unblock-File $dl
            Expand-Archive -Path $dl -DestinationPath "$env:RUNNER_TEMP\apkex" -Force
            Copy-Item "$env:RUNNER_TEMP\apkex\lib\arm64-v8a\libedgetx-st16mk3-simulator.so" $dst -Force
          } else {
            Copy-Item $dl $dst -Force
          }
          Get-Item $dst | Format-List Length,FullName

      - name: Stage the committed simulator library (prebuilt fallback)
        if: ${{ env.EDGETX_MODE != 'source' && env.SIM_LIB_URL == '' }}
        shell: pwsh
        run: |
          # The GitHub web uploader silently drops hidden (dot-prefixed) entries, so
          # the library normally lives in the visible edgetx-lib/ instead of .edgetx/.
          $candidates = @(
            "edgetx-lib\libedgetx-st16mk3-simulator.so",
            "edgetx-lib\libedgetx-st16mk3-simulator.so.txt",
            ".edgetx\libedgetx-st16mk3-simulator.so"
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Write-Error "prebuilt mode needs a library: put libedgetx-st16mk3-simulator.so in edgetx-lib\, or set sim_lib_url (see BUILD_APK_CI.md)."
          }
          New-Item -ItemType Directory -Force -Path "app\build\edgetx-libs\arm64-v8a" | Out-Null
          Copy-Item $src "app\build\edgetx-libs\arm64-v8a\libedgetx-st16mk3-simulator.so" -Force
          Get-Item "app\build\edgetx-libs\arm64-v8a\libedgetx-st16mk3-simulator.so" | Format-List Length,FullName

      # The DJI App Key is bound to the package name *and* the signing certificate, so
      # the certificate has to be the same on every build. signing/release.keystore is
      # committed for that reason; this step only has to create it once, print it so it
      # can be committed, and fail loudly if someone removed it (a fresh keystore means
      # a fresh certificate, and an App Key that quietly stops working).
      - name: Prepare the signing keystore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing | Out-Null
          if (Test-Path signing\release.keystore) {
            Write-Host "signing/release.keystore is in the checkout"
          } elseif ("$env:NEW_SIGNING_KEY" -eq "true") {
            Write-Host "creating signing/release.keystore (new_signing_key=true)"
            & keytool -genkeypair -keystore signing\release.keystore -alias edgetx `
              -keyalg RSA -keysize 2048 -validity 10950 `
              -storepass edgetx -keypass edgetx `
              -dname "CN=EdgeTX Android, O=EdgeTX, C=CN"
            if ($LASTEXITCODE -ne 0) { Write-Error "keytool could not create the keystore" }
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("signing\release.keystore"))
            Write-Host "::notice title=Commit signing/release.keystore::This run created the signing keystore. Commit it so the certificate never changes: base64 of signing/release.keystore follows."
            Write-Host "RELEASE-KEYSTORE-BASE64-BEGIN"
            Write-Host $b64
            Write-Host "RELEASE-KEYSTORE-BASE64-END"
          } else {
            Write-Error "signing/release.keystore is missing. The DJI App Key is bound to the signing certificate, so the APK must not be signed with a certificate that changes from run to run. Re-run with new_signing_key=true to create one, then commit it."
          }
          & keytool -list -v -keystore signing\release.keystore -storepass edgetx |
            Select-String -Pattern 'Alias name|SHA1:|SHA256:'

      - name: Build APK
        shell: pwsh
        run: |
          $gradleArgs = @()
          if ($env:EDGETX_MODE -ne "source") {
            $gradleArgs += "-Pedgetx.skipBuild=true"
          } else {
            $dir = ("$env:GITHUB_WORKSPACE\edgetx" -replace '\\','/')
            $gradleArgs += "-Pedgetx.dir=$dir"
          }
          if ($env:DJI_MSDK -eq "true") { $gradleArgs += "-Pdji.msdk=true" }
          if ($env:DJI_APP_KEY -ne "") { $gradleArgs += "-Pdji.appKey=$env:DJI_APP_KEY" }

          $logFile = "$env:RUNNER_TEMP\gradle.log"
          & .\gradlew.bat --no-daemon :app:assembleRelease @gradleArgs 2>&1 |
            Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            # Report the reason as a check annotation. Reading the Actions log
            # needs actions:read; an annotation is readable by anyone, so the
            # failure can be diagnosed without the web UI.
            $lines  = Get-Content $logFile -ErrorAction SilentlyContinue
            $picked = $lines | Where-Object {
              $_ -match '^\s*(FAILURE:|e: |error:|\* What went wrong|Caused by:|> Task .*FAILED|CMake Error|ninja:|ld: |clang(\+\+)?: error|error C[0-9]|BUILD FAILED|Execution failed for task|Could not (resolve|find|determine|download|create|open|load)|No such file|not found|cannot find)' -or
              $_ -match 'error:' -or
              $_ -match 'Unresolved reference' -or
              $_ -match 'What went wrong'
            } | Select-Object -Last 40
            if (-not $picked) { $picked = $lines | Select-Object -Last 40 }
            $msg = (($picked -replace '%', '%25') -join "%0A")
            Write-Host "::error title=Build APK failed::$msg"
            exit 1
          }
          Get-Item app\build\outputs\apk\release\app-release.apk | Format-List Length,FullName

      # Print both certificates of the finished APK: what the DJI App Key has to be
      # registered against (the signer), and the whole file's digest (a quick way to
      # tell two builds apart).
      - name: Print the APK signing certificate (for the DJI App Key)
        shell: pwsh
        run: |
          & keytool -printcert -jarfile app\build\outputs\apk\release\app-release.apk |
            Select-String -Pattern 'Signer|Owner:|SHA1:|SHA256:|SHA-1|SHA-256'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edgetx-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
