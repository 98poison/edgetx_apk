org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# No AndroidX/AppCompat dependencies are used by this pure-native app.
android.useAndroidX=true
android.nonTransitiveRClass=true

# android.overridePathCheck
#
# AGP refuses to build when any path component contains a non-ASCII character,
# because a few of the tools it shells out to (aapt2, and the NDK's own
# wrappers) mishandle them on Windows. This tree lives under a directory whose
# name is Chinese, so the check fires on every build.
#
# The setting is a suppression, not a fix. If it were wrong the failure would be a
# build error naming the mangled path - loud and immediate - rather than a subtly
# corrupt artefact, so the trade is worth making for a tree that keeps its name.
android.overridePathCheck=true